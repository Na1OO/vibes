<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Настроение Насти</title>
<style>
:root{--bg:#fff5f7;--card:#fff;--text:#3a2a30;--muted:#9a8890;--track:#f0e3e7;--accent:#e85d8a;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1d1519;--card:#2a1f25;--text:#f6e9ee;--muted:#a8939c;--track:#3a2c33;--accent:#ff7aa5;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border-radius:28px;padding:28px 24px;width:100%;max-width:420px;text-align:center;box-shadow:0 8px 30px rgba(232,93,138,.15)}
h1{font-size:1.5rem;margin:0 0 4px}
#secret{cursor:inherit;-webkit-tap-highlight-color:transparent;user-select:none}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 12px}
svg{width:100%;height:auto}
#needle{transition:transform 1s cubic-bezier(.3,1.4,.5,1);transform-origin:150px 150px}
.emoji{font-size:3rem;line-height:1;margin-top:4px}
.label{font-size:1.25rem;font-weight:600;margin:6px 0 2px}
.note{color:var(--muted);font-size:.95rem;min-height:1.2em}
.upd{color:var(--muted);font-size:.75rem;margin-top:10px}
#hist{margin-top:18px;padding-top:14px;border-top:1px dashed var(--track);display:none}
#hist h2{font-size:1rem;margin:0 0 10px;color:var(--muted);font-weight:600}
#bars{display:flex;align-items:flex-end;gap:4px;height:70px;margin-bottom:10px}
#bars div{flex:1;border-radius:6px 6px 2px 2px;min-height:6px}
#items{list-style:none;margin:0;padding:0;text-align:left;font-size:.85rem}
#items li{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--track)}
#items .d{color:var(--muted);white-space:nowrap}
#items .n{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
#panel{display:none;margin-top:18px;padding-top:16px;border-top:1px dashed var(--track)}
#panel input[type=range]{width:100%;accent-color:var(--accent)}
#panel input[type=text]{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:12px;border:1px solid var(--track);background:var(--bg);color:var(--text);font:inherit;margin-top:10px}
.presets{display:flex;justify-content:space-between;margin:8px 0}
.presets button{font-size:1.6rem;background:var(--bg);border:1px solid var(--track);border-radius:14px;padding:6px 10px;cursor:pointer}
#save{margin-top:12px;width:100%;padding:12px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.msg{font-size:.8rem;color:var(--muted);margin-top:8px;min-height:1em}
#out{background:none;border:0;color:var(--muted);font-size:.75rem;cursor:pointer;margin-top:6px;text-decoration:underline}
</style>
</head>
<body>
<main class="card">
  <h1>Настроение <span id="secret">Насти</span></h1>
  <p class="sub">Сверься, прежде чем писать 🙂</p>
  <svg viewBox="0 0 300 175" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e5484d"/><stop offset=".5" stop-color="#f5c542"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient></defs>
    <path d="M30 150 A120 120 0 0 1 270 150" fill="none" stroke="var(--track)" stroke-width="26" stroke-linecap="round"/>
    <path d="M30 150 A120 120 0 0 1 270 150" fill="none" stroke="url(#g)" stroke-width="22" stroke-linecap="round"/>
    <g id="needle" style="transform:rotate(-90deg)">
      <line x1="150" y1="150" x2="150" y2="48" stroke="var(--text)" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle cx="150" cy="150" r="10" fill="var(--text)"/>
  </svg>
  <div class="emoji" id="emoji">🤔</div>
  <div class="label" id="label">Загружаю…</div>
  <div class="note" id="note"></div>
  <div class="upd" id="upd"></div>

  <section id="hist">
    <h2>История настроения</h2>
    <div id="bars"></div>
    <ul id="items"></ul>
  </section>

  <section id="panel">
    <strong>Привет, Настя 💗</strong>
    <div class="presets" id="presets"></div>
    <input type="range" id="range" min="0" max="100" value="50">
    <input type="text" id="text" maxlength="80" placeholder="Пара слов от себя (необязательно)">
    <button id="save">Сохранить настроение</button>
    <div class="msg" id="msg"></div>
    <button id="out">Выйти</button>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, push, query, orderByChild, limitToLast, onValue }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// 1) Вставь сюда конфиг из Firebase (Project settings → Your apps → Web app)
const firebaseConfig = {
  apiKey: "AIzaSyAfZ5DbDx2RSSR2yTrpcRH2eI9PcveeYpo",
  authDomain: "nastyavibes.firebaseapp.com",
  databaseURL: "https://nastyavibes-default-rtdb.firebaseio.com",
  projectId: "nastyavibes",
  appId: "1:84542460295:web:004d9f0ed68fb9716ac322"
};
// 2) Почта служебного пользователя Насти (создаётся в Firebase Authentication).
//    Её пароль и есть секретное слово. Эта же почта указана в правилах Realtime Database.
const NASTYA_EMAIL = "salminiya.96@gmail.com";

const MOODS = [
  {max:20, e:"😡", t:"Лучше не трогать"},
  {max:40, e:"😔", t:"Грустновато"},
  {max:60, e:"😐", t:"Нормально"},
  {max:80, e:"🙂", t:"Хорошее"},
  {max:101, e:"🥰", t:"Просто прекрасное"}
];
const $ = id => document.getElementById(id);
const moodOf = v => MOODS.find(m => v < m.max);
const clamp = v => Math.max(0, Math.min(100, Number(v)));
const fmt = ts => new Date(ts).toLocaleString("ru-RU", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});

function render(d){
  const v = clamp(d.value), m = moodOf(v);
  $("needle").style.transform = "rotate(" + (v * 1.8 - 90) + "deg)";
  $("emoji").textContent = m.e;
  $("label").textContent = m.t;
  $("note").textContent = d.note || "";
  $("upd").textContent = d.ts ? "Обновлено: " + fmt(d.ts) : "";
}

function renderHist(list){
  $("hist").style.display = list.length ? "block" : "none";
  $("bars").textContent = "";
  list.slice().reverse().forEach(h => {
    const v = clamp(h.value), b = document.createElement("div");
    b.style.height = Math.max(8, v * 0.7) + "px";
    b.style.background = "hsl(" + Math.round(v * 1.2) + ",70%,52%)";
    b.title = fmt(h.ts) + " — " + moodOf(v).t;
    $("bars").appendChild(b);
  });
  $("items").textContent = "";
  list.slice(0, 7).forEach(h => {
    const v = clamp(h.value), li = document.createElement("li");
    const e = document.createElement("span"); e.textContent = moodOf(v).e;
    const d = document.createElement("span"); d.className = "d"; d.textContent = fmt(h.ts);
    const n = document.createElement("span"); n.className = "n"; n.textContent = h.note || moodOf(v).t;
    li.append(e, d, n);
    $("items").appendChild(li);
  });
}

$("label").textContent = "Настя ещё не отметилась";
$("emoji").textContent = "🤔";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

onValue(
  query(ref(db, "moods"), orderByChild("ts"), limitToLast(14)),
  snap => {
    const list = [];
    snap.forEach(c => { list.push(c.val()); });
    list.sort((a, b) => b.ts - a.ts);
    if (list.length) render(list[0]);
    renderHist(list);
  },
  () => { $("label").textContent = "Не получилось загрузить"; }
);

// --- Режим Насти ---
onAuthStateChanged(auth, user => {
  $("panel").style.display = (user && user.email === NASTYA_EMAIL) ? "block" : "none";
});

$("secret").addEventListener("click", async () => {
  if (auth.currentUser) return;
  const w = prompt("Кто здесь? Секретное слово:");
  if (!w) return;
  try { await signInWithEmailAndPassword(auth, NASTYA_EMAIL, w.trim().toLowerCase()); } catch (e) {}
});

$("out").addEventListener("click", () => signOut(auth));

[["😡",10],["😔",30],["😐",50],["🙂",70],["🥰",90]].forEach(([e, v]) => {
  const b = document.createElement("button");
  b.textContent = e;
  b.onclick = () => { $("range").value = v; };
  $("presets").appendChild(b);
});

$("save").addEventListener("click", async () => {
  try {
    await push(ref(db, "moods"), {
      value: Number($("range").value),
      note: $("text").value.trim(),
      ts: Date.now()
    });
    $("text").value = "";
    $("msg").textContent = "Сохранено ✔";
  } catch (e) { $("msg").textContent = "Не удалось сохранить: " + (e.code || "ошибка"); }
});
</script>
</body>
</html>
